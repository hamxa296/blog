<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIKI Chronicles — Under Maintenance</title>
  
  <!-- Favicons and Web Manifest -->
  <link rel="icon" type="image/x-icon" href="/favicons/favicon.ico?v=1.9">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png?v=1.9">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png?v=1.9">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicons/favicon-48x48.png?v=1.9">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png?v=1.9">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicons/favicon-192x192.png?v=1.9">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicons/favicon-512x512.png?v=1.9">
  <link rel="mask-icon" href="/favicons/safari-pinned-tab.svg?v=1.9" color="#000000">
  <meta name="msapplication-TileColor" content="#000000">
  <meta name="msapplication-TileImage" content="/favicons/mstile-150x150.png?v=1.9">
  <meta name="theme-color" content="#000000">
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=1.9">
  <link rel="manifest" href="/site.webmanifest?v=1.9">
  <link rel="icon" type="image/png" href="/logo.png?v=1.9">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?v=1.9"></script>
  <script>
    if (typeof window.tailwind === 'undefined') {
      console.warn('Tailwind CDN failed to load, using fallback styles');
      const fallbackCSS = document.createElement('link');
      fallbackCSS.rel = 'stylesheet';
      fallbackCSS.href = 'tailwind-fallback.css?v=1.9';
      document.head.appendChild(fallbackCSS);
    }
  </script>

  <!-- Google Fonts: Editorial & Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">

  <!-- Apply theme immediately to prevent flash -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem('selected-theme') || 'basic-dark';
      if (document.documentElement) document.documentElement.classList.add(`theme-${savedTheme}`);
      if (document.body) document.body.classList.add(`theme-${savedTheme}`);
      else {
        document.addEventListener('DOMContentLoaded', function () {
          if (document.body) document.body.classList.add(`theme-${savedTheme}`);
        });
      }
    })();
  </script>

  <!-- Custom CSS & Global Styles -->
  <link rel="stylesheet" href="styles.css?v=1.9">

  <!-- Minimalist Editorial Monochrome Styles -->
  <style>
    :root {
      --c-navy: #000000;
      --c-deep: #0a0a0a;
      --c-steel: #525252;
      --c-light: #e5e5e5;
      --c-snow: #ffffff;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #050505;
      color: #e5e5e5;
      overflow-x: hidden;
    }

    /* Ultra-subtle, high-contrast monochrome campus background texture */
    .bg-editorial {
      background: linear-gradient(180deg, rgba(5, 5, 5, 0.92) 0%, rgba(5, 5, 5, 0.97) 100%), url('background.jpeg?v=1.9') no-repeat center center fixed;
      background-size: cover;
    }

    .font-outfit {
      font-family: 'Outfit', sans-serif;
    }

    .font-serif-editorial {
      font-family: 'Playfair Display', serif;
    }

    /* Clean typography selection */
    ::selection {
      background-color: #ffffff;
      color: #000000;
    }
  </style>
</head>

<body class="bg-editorial min-h-screen flex flex-col items-center justify-center p-6 sm:p-12 md:p-16 lg:p-24 selection:bg-white selection:text-black">

  <!-- Pure Editorial Typography Centerpiece -->
  <main class="w-full max-w-4xl mx-auto py-8">
    
    <!-- Eyebrow Monospace Label -->
    <div class="text-xs font-mono tracking-[0.3em] uppercase text-neutral-500 mb-6 sm:mb-8">
      [ Scheduled Maintenance &amp; Upgrade ]
    </div>

    <!-- Main Editorial Headline -->
    <h1 class="text-5xl sm:text-7xl md:text-8xl lg:text-9xl font-outfit font-light tracking-tight text-white leading-[0.95] mb-8 sm:mb-12">
      The next <br class="hidden sm:inline">
      <span class="font-serif-editorial italic font-normal text-neutral-400">chapter</span> is <br class="hidden sm:inline">
      being written.
    </h1>

    <!-- Minimalist Description -->
    <p class="text-base sm:text-lg md:text-xl text-neutral-400 font-light leading-relaxed max-w-xl">
      GIKI Chronicles is currently undergoing scheduled maintenance. We are refining our digital architecture, simplifying the user experience, and elevating the platform for the GIKI community.
    </p>

    <!-- Minimalist Instagram Link -->
    <div class="mt-12 sm:mt-14">
      <a href="https://instagram.com/giki.chronicles" target="_blank" rel="noopener noreferrer" class="group inline-flex items-center gap-2.5 text-xs font-mono tracking-[0.25em] uppercase text-neutral-500 hover:text-white underline underline-offset-8 decoration-neutral-800 hover:decoration-white transition-all duration-300">
        <span>Instagram</span>
        <svg class="w-3.5 h-3.5 group-hover:translate-x-1 transition-transform duration-300 text-neutral-500 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
        </svg>
      </a>
    </div>

  </main>

  <!-- Core Scripts (Theme & Security only) -->
  <script src="security-utils.js"></script>
  <script src="csp-headers.js"></script>
  <script src="theme-manager.js"></script>
  <script src="notifications.js"></script>
</body>

</html>
